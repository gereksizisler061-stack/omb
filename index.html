<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Scanner Panel</title>
<style>
body{
  margin:0;
  background:#0f1115;
  color:#fff;
  font-family:Arial,sans-serif;
}
#login{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.card{
  background:#171a21;
  padding:28px;
  border-radius:14px;
  width:320px;
  box-shadow:0 0 30px rgba(0,0,0,.45);
}
.card h2{margin-top:0}
input,button{
  width:100%;
  box-sizing:border-box;
  padding:11px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #333;
  background:#0f1115;
  color:white;
}
button{
  background:#2563eb;
  border:0;
  cursor:pointer;
  font-weight:bold;
}
#error{
  color:#ff5555;
  margin-top:12px;
  font-size:13px;
}
#app{
  display:none;
  padding:20px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th,td{
  border:1px solid #333;
  padding:7px;
  font-size:13px;
}
th{
  background:#1f2430;
}
</style>
</head>

<body>

<div id="login">
  <div class="card">
    <h2>Scanner Panel</h2>
    <input id="username" placeholder="Kullanıcı adı">
    <input id="password" type="password" placeholder="Şifre">
    <button onclick="login()">Giriş yap</button>
    <div id="error"></div>
  </div>
</div>

<div id="app">
  <h2>Scanner Panel</h2>
  <div id="status">Yükleniyor...</div>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Rank</th>
        <th>Family</th>
        <th>Wealth</th>
        <th>Plating</th>
        <th>Casino</th>
        <th>Updated</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
const users = [
  { user: "admin", pass: "616161" },
  { user: "deneme", pass: "313131" }
];

function login(){
  const USER = document.getElementById("username").value.trim();
  const PASS = document.getElementById("password").value.trim();

  const valid = users.find(u => u.user === USER && u.pass === PASS);

  if(!valid){
    document.getElementById("error").innerText = "Kullanıcı adı veya şifre yanlış";
    return;
  }

  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "block";

  load();
  setInterval(load, 5000);
}

async function load(){
  const status = document.getElementById("status");
  const tbody = document.getElementById("tbody");

  try{
    const res = await fetch("/api/list");
    const data = await res.json();

    if(!res.ok){
      status.innerText = "API hatası: " + JSON.stringify(data);
      return;
    }

    status.innerText = "Toplam kayıt: " + data.length;
    tbody.innerHTML = "";

    data.forEach(u => {
      tbody.innerHTML += `
        <tr>
          <td>${u.name || ""}</td>
          <td>${u.rank || ""}</td>
          <td>${u.family || ""}</td>
          <td>${u.wealth || ""}</td>
          <td>${u.plating || ""}</td>
          <td>${u.casino || ""}</td>
          <td>${u.updated_at || ""}</td>
        </tr>
      `;
    });

  }catch(e){
    status.innerText = "Frontend hata: " + e.message;
  }
}
</script>

</body>
</html>
