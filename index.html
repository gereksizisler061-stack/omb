<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Scanner Panel</title>

<style>
body{
  margin:0;
  background:linear-gradient(135deg,#0f172a,#020617);
  color:#e2e8f0;
  font-family:Segoe UI,Arial;
}

/* LOGIN */
#login{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.card{
  background:#0f172a;
  padding:30px;
  border-radius:16px;
  width:340px;
  box-shadow:0 0 40px rgba(0,0,0,.7);
  border:1px solid #1e293b;
}
.card h2{
  margin:0 0 10px;
  color:#38bdf8;
}
input,select{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #334155;
  background:#020617;
  color:white;
}
button{
  width:100%;
  margin-top:12px;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#38bdf8;
  color:black;
  font-weight:bold;
  cursor:pointer;
}
button:hover{
  background:#0ea5e9;
}

#error{
  color:#ef4444;
  margin-top:10px;
}

/* APP */
#app{
  display:none;
  padding:20px;
}

h2{
  color:#38bdf8;
}

/* FILTERS */
#filters{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin:15px 0;
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
  border-radius:10px;
  overflow:hidden;
}

th{
  background:#1e293b;
  color:#38bdf8;
  cursor:pointer;
  padding:10px;
}

th:hover{
  background:#334155;
}

td{
  padding:8px;
  border-bottom:1px solid #1e293b;
}

tr:hover{
  background:#020617;
}

/* COLORS */
.rank{
  color:#facc15;
}
.wealth{
  color:#22c55e;
}
.plating-high{
  color:#22c55e;
}
.plating-low{
  color:#ef4444;
}
</style>
</head>

<body>

<div id="login">
  <div class="card">
    <h2>Scanner Panel</h2>
    <input id="username" placeholder="Kullanıcı adı">
    <input id="password" type="password" placeholder="Şifre">
    <button onclick="login()">Giriş</button>
    <div id="error"></div>
  </div>
</div>

<div id="app">
  <h2>Scanner Panel</h2>
  <div id="status"></div>

  <div id="filters">
    <input id="searchInput" placeholder="İsim ara..." oninput="render()">

    <select id="rankFilter" onchange="render()">
      <option value="0">All Ranks</option>
      <option value="14">Bruglione+</option>
      <option value="15">Capodecina+</option>
      <option value="16">Godfather</option>
    </select>

    <select id="wealthFilter" onchange="render()">
      <option value="0">All Wealth</option>
      <option value="4">Rich+</option>
      <option value="5">Very rich+</option>
    </select>

    <label>
      <input type="checkbox" id="casinoOnly" onchange="render()">
      Casino only
    </label>
  </div>

  <table>
    <thead>
      <tr>
        <th onclick="sortTable('position')">Pos</th>
        <th onclick="sortTable('name')">Name</th>
        <th onclick="sortTable('rank')">Rank</th>
        <th onclick="sortTable('family')">Family</th>
        <th onclick="sortTable('wealth')">Wealth</th>
        <th>Casino</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
const users = [
  { user: "admin", pass: "616161" }
];

let currentData = [];
let sortKey=null, sortDesc=false;

/* LOGIN */
function login(){
  const u=document.getElementById("username").value;
  const p=document.getElementById("password").value;

  if(!users.find(x=>x.user===u && x.pass===p)){
    document.getElementById("error").innerText="Hatalı giriş";
    return;
  }

  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";

  load();
  setInterval(load,5000);
}

/* LOAD */
async function load(){
  const res=await fetch("/api/list");
  const data=await res.json();
  currentData=data;
  render();
}

/* SORT */
function sortTable(key){
  if(sortKey===key) sortDesc=!sortDesc;
  else{ sortKey=key; sortDesc=false; }
  render();
}

/* FILTER */
function getFiltered(){
  const s=document.getElementById("searchInput").value.toLowerCase();
  const r=Number(document.getElementById("rankFilter").value);
  const w=Number(document.getElementById("wealthFilter").value);
  const c=document.getElementById("casinoOnly").checked;

  return currentData.filter(u=>{
    if(s && !u.name.toLowerCase().includes(s)) return false;
    if(r && u.rankOrder<r) return false;
    if(w && u.wealthOrder<w) return false;
    if(c && !u.casino) return false;
    return true;
  });
}

/* RENDER */
function render(){
  let rows=getFiltered();

  if(sortKey){
    rows.sort((a,b)=>{
      let A=a[sortKey]||"", B=b[sortKey]||"";
      if(typeof A==="string"){
        return sortDesc ? B.localeCompare(A):A.localeCompare(B);
      }
      return sortDesc ? B-A : A-B;
    });
  }

  const tbody=document.getElementById("tbody");
  tbody.innerHTML="";

  rows.forEach(u=>{
    tbody.innerHTML+=`
      <tr>
        <td>${u.position||u.pos||""}</td>
        <td>${u.name}</td>
        <td class="rank">${u.rank}</td>
        <td>${u.family}</td>
        <td class="wealth">${u.wealth}</td>
        <td>${u.casino||""}</td>
      </tr>
    `;
  });
}
</script>

</body>
</html>
