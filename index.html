<script>
const users = [
  { user: "admin", pass: "123456" },
  { user: "mehmet", pass: "5555" }
];

const USER = prompt("Kullanıcı adı:");
const PASS = prompt("Şifre:");

const valid = users.find(u => u.user === USER && u.pass === PASS);

if (!valid) {
  document.body.innerHTML = "<h1>Giriş reddedildi</h1>";
  throw new Error("Auth failed");
}
</script>
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Scanner Panel</title>
</head>
<body style="background:#111;color:#fff;font-family:Arial;padding:20px">

<h2>Scanner Panel</h2>
<div id="status">Yükleniyor...</div>

<table border="1" cellpadding="6" cellspacing="0" style="margin-top:15px;width:100%;border-collapse:collapse;color:white">
  <thead>
    <tr>
      <th>Name</th>
      <th>Rank</th>
      <th>Family</th>
      <th>Wealth</th>
      <th>Plating</th>
      <th>Casino</th>
      <th>Updated</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<script>
async function load() {
  const status = document.getElementById("status");
  const tbody = document.getElementById("tbody");

  try {
    const res = await fetch("/api/list");
    const data = await res.json();

    if (!res.ok) {
      status.innerText = "API hatası: " + JSON.stringify(data);
      return;
    }

    status.innerText = "Toplam kayıt: " + data.length;
    tbody.innerHTML = "";

    data.forEach(u => {
      tbody.innerHTML += `
        <tr>
          <td>${u.name || ""}</td>
          <td>${u.rank || ""}</td>
          <td>${u.family || ""}</td>
          <td>${u.wealth || ""}</td>
          <td>${u.plating || ""}</td>
          <td>${u.casino || ""}</td>
          <td>${u.updated_at || ""}</td>
        </tr>
      `;
    });
  } catch (e) {
    status.innerText = "Frontend hata: " + e.message;
  }
}

load();
setInterval(load, 5000);
</script>

</body>
</html>
