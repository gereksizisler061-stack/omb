<!DOCTYPE html>
<html>
<head>
  <title>Scanner Panel</title>
</head>
<body style="background:#111;color:#fff;font-family:Arial">

<h2>Users</h2>

<table border="1" id="tbl"></table>

<script>
async function load() {
  const res = await fetch("/api/list");
  const data = await res.json();

  const tbl = document.getElementById("tbl");
  tbl.innerHTML = "";

  data.forEach(u => {
    tbl.innerHTML += `
      <tr>
        <td>${u.name}</td>
        <td>${u.rank}</td>
        <td>${u.family}</td>
        <td>${u.wealth}</td>
        <td>${u.plating}</td>
      </tr>
    `;
  });
}

load();
setInterval(load, 5000);
</script>

</body>
</html>
