<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Scanner Panel</title>
<style>
body{margin:0;background:#0f1115;color:#fff;font-family:Arial,sans-serif}
#login{height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#171a21;padding:28px;border-radius:14px;width:320px;box-shadow:0 0 30px rgba(0,0,0,.45)}
.card h2{margin-top:0}
input,button,select{box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #333;background:#0f1115;color:white}
.card input,.card button{width:100%;margin-top:10px}
button{background:#2563eb;border:0;cursor:pointer;font-weight:bold}
#error{color:#ff5555;margin-top:12px;font-size:13px}
#app{display:none;padding:20px}
#filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
#filters input,#filters select{min-width:140px}
label{display:flex;align-items:center;gap:6px;font-size:13px}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{border:1px solid #333;padding:7px;font-size:13px}
th{background:#1f2430;cursor:pointer;user-select:none}
th:hover{background:#293246}
</style>
</head>

<body>

<div id="login">
  <div class="card">
    <h2>Scanner Panel</h2>
    <input id="username" placeholder="Kullanıcı adı">
    <input id="password" type="password" placeholder="Şifre">
    <button onclick="login()">Giriş yap</button>
    <div id="error"></div>
  </div>
</div>

<div id="app">
  <h2>Scanner Panel</h2>
  <div id="status">Yükleniyor...</div>

  <div id="filters">
    <input id="searchInput" placeholder="İsim ara..." oninput="render()">

    <select id="rankFilter" onchange="render()">
      <option value="0">All Ranks</option>
      <option value="14">Bruglione+</option>
      <option value="15">Capodecina+</option>
      <option value="16">Godfather / First Lady</option>
    </select>

    <select id="wealthFilter" onchange="render()">
      <option value="0">All Wealth</option>
      <option value="4">Rich+</option>
      <option value="5">Very rich+</option>
      <option value="6">Too rich+</option>
      <option value="7">Richer than God</option>
    </select>

    <select id="platingFilter" onchange="render()">
      <option value="0">All Plating</option>
      <option value="1">None+</option>
      <option value="2">Very Low+</option>
      <option value="3">Low+</option>
      <option value="4">Medium+</option>
      <option value="5">High+</option>
      <option value="6">Very High only</option>
    </select>

    <select id="familyFilter" onchange="render()">
      <option value="all">All Families</option>
      <option value="none">None only</option>
      <option value="with">With family</option>
    </select>

    <label>
      <input type="checkbox" id="casinoOnly" onchange="render()">
      Casino only
    </label>
  </div>

  <table>
    <thead>
      <tr>
        <th onclick="sortTable('position')">Pos</th>
        <th onclick="sortTable('name')">Name</th>
        <th onclick="sortTable('rank')">Rank</th>
        <th onclick="sortTable('family')">Family</th>
        <th onclick="sortTable('wealth')">Wealth</th>
        <th onclick="sortTable('plating')">Plating</th>
        <th onclick="sortTable('casino')">Casino</th>
        <th onclick="sortTable('updated_at')">Updated</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
const users = [
  { user: "admin", pass: "616161" },
  { user: "deneme", pass: "313131" }
];

let currentData = [];
let sortKey = null;
let sortDesc = false;
let refreshTimer = null;

const rankOrder = {
  "Empty-Suit": 1, "Empty-suit": 1,
  "Delivery Boy": 2, "Delivery Girl": 2,
  "Picciotto": 3,
  "Shoplifter": 4,
  "Pickpocket": 5,
  "Thief": 6,
  "Associate": 7,
  "Mobster": 8,
  "Soldier": 9,
  "Swindler": 10,
  "Assassin": 11,
  "Local Chief": 12,
  "Chief": 13,
  "Bruglione": 14,
  "Capodecina": 15,
  "Godfather": 16,
  "First Lady": 16
};

const wealthOrder = {
  "Straydog": 1,
  "Poor": 2,
  "Nouveau Riche": 3,
  "Rich": 4,
  "Very rich": 5,
  "Too rich to be true": 6,
  "Richer than God": 7
};

const platingOrder = {
  "None": 1,
  "Very Low": 2,
  "Low": 3,
  "Medium": 4,
  "High": 5,
  "Very High": 6
};

function login(){
  const USER = document.getElementById("username").value.trim();
  const PASS = document.getElementById("password").value.trim();

  const valid = users.find(u => u.user === USER && u.pass === PASS);

  if(!valid){
    document.getElementById("error").innerText = "Kullanıcı adı veya şifre yanlış";
    return;
  }

  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "block";

  load();

  if(refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(load, 5000);
}

async function load(){
  const status = document.getElementById("status");

  try{
    const res = await fetch("/api/list");
    const data = await res.json();

    if(!res.ok){
      status.innerText = "API hatası: " + JSON.stringify(data);
      return;
    }

    currentData = data;
    render();

  }catch(e){
    status.innerText = "Frontend hata: " + e.message;
  }
}

function sortTable(key){
  if(sortKey === key){
    sortDesc = !sortDesc;
  }else{
    sortKey = key;
    sortDesc = false;
  }

  render();
}

function getSortValue(row, key){
  if(key === "position") return Number(row.position || row.pos || 0);
  if(key === "rank") return rankOrder[row.rank] || 0;
  if(key === "wealth") return wealthOrder[row.wealth] || 0;
  if(key === "plating") return platingOrder[row.plating] || 0;
  return row[key] || "";
}

function getFilteredRows(){
  const search = document.getElementById("searchInput")?.value.toLowerCase().trim() || "";
  const rankFilter = Number(document.getElementById("rankFilter")?.value || 0);
  const wealthFilter = Number(document.getElementById("wealthFilter")?.value || 0);
  const platingFilter = Number(document.getElementById("platingFilter")?.value || 0);
  const familyFilter = document.getElementById("familyFilter")?.value || "all";
  const casinoOnly = document.getElementById("casinoOnly")?.checked || false;

  return currentData.filter(u => {
    const name = (u.name || "").toLowerCase();
    const family = u.family || "";
    const casino = u.casino || "";

    if(search && !name.includes(search)) return false;

    if(rankFilter && (rankOrder[u.rank] || 0) < rankFilter) return false;

    if(wealthFilter && (wealthOrder[u.wealth] || 0) < wealthFilter) return false;

    if(platingFilter && (platingOrder[u.plating] || 0) < platingFilter) return false;

    if(familyFilter === "none" && family !== "None") return false;
    if(familyFilter === "with" && family === "None") return false;

    if(casinoOnly && !casino) return false;

    return true;
  });
}

function render(){
  const status = document.getElementById("status");
  const tbody = document.getElementById("tbody");

  let rows = getFilteredRows();

  if(sortKey){
    rows.sort((a, b) => {
      let A = getSortValue(a, sortKey);
      let B = getSortValue(b, sortKey);

      if(typeof A === "string"){
        A = A.toLowerCase();
        B = String(B).toLowerCase();
        return sortDesc ? B.localeCompare(A) : A.localeCompare(B);
      }

      return sortDesc ? B - A : A - B;
    });
  }

  status.innerText = "Gösterilen: " + rows.length + " / Toplam: " + currentData.length;
  tbody.innerHTML = "";

  rows.forEach(u => {
    tbody.innerHTML += `
      <tr>
        <td>${u.position || u.pos || ""}</td>
        <td>${u.name || ""}</td>
        <td>${u.rank || ""}</td>
        <td>${u.family || ""}</td>
        <td>${u.wealth || ""}</td>
        <td>${u.plating || ""}</td>
        <td>${u.casino || ""}</td>
        <td>${u.updated_at || ""}</td>
      </tr>
    `;
  });
}
</script>

</body>
</html>
